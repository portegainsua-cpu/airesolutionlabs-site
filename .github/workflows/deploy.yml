# Publica la web en GitHub Pages con Astro (guía oficial: docs.astro.build/en/guides/deploy/github/).
# Requiere Settings > Pages > Source = "GitHub Actions" (lo cambia Pablo).
name: Publicar en GitHub Pages

on:
  push:
    branches: [ main ]
  # En los Pull Request hacia main solo se compila (comprobación); no se publica
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; no se cancela uno que ya esté en marcha.
# Las compilaciones de los Pull Request van en su propio grupo y no esperan a los despliegues.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7
      - name: Instalar, compilar y subir la web
        uses: withastro/action@v6
        env:
          ASTRO_TELEMETRY_DISABLED: 1

  deploy:
    needs: build
    # Solo se publica desde main, nunca desde un Pull Request
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
